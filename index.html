const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const linkify = s => s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 Link</a>').replace(/\n/g, "<br>");
const embed = q => `https://maps.google.com/maps?q=${encodeURIComponent(q)}&z=15&output=embed`;
const navUrl = q => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}&travelmode=walking`;
const mapsUrl = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const eur = v => v.toLocaleString("de-DE", {style:"currency", currency:"EUR"});
const mobile = matchMedia("(max-width:800px)");
const buzz = () => navigator.vibrate?.(12);
const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2000); };
const wd = d => new Date(d + "T12:00:00").toLocaleDateString("de-DE", {weekday:"short"});
const dm = d => d.slice(8, 10) + "." + d.slice(5, 7) + ".";
const shiftDate = (d, n) => new Date(Date.parse(d + "T12:00:00Z") + n * 864e5).toISOString().slice(0, 10);
const fmtMin = m => m < 60 ? `${m} Min.` : `${Math.floor(m / 60)} h ${m % 60 ? m % 60 + " min" : ""}`;
const toMin = s => { const m = /(\d{1,2}):(\d{2})/.exec(s || ""); if (!m) return null; const v = +m[1] * 60 + +m[2]; return v < 300 ? v + 1440 : v; };

/* ---------- State ---------- */
const KEY = "trip-v2", ME_KEY = "trip-me", THEME_KEY = "trip-theme";
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem(THEME_KEY, t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === "light" ? "#eef1f6" : "#0b1624";
  const btn = $("bTheme");
  if (!btn) return;
  const light = t === "light";
  btn.textContent = light ? "🌙" : "☀️";
  btn.title = light ? "Dark Mode" : "Light Mode";
  btn.setAttribute("aria-label", light ? "Dark Mode aktivieren" : "Light Mode aktivieren");
}
function normalize(s) {
  if (Array.isArray(s)) s = {days: s};
  const d = structuredClone(DEFAULTS);
  s = {...d, ...s};
  s.days = s.days.map(x => ({...(d.days.find(y => y.id === x.id) || {}), ...x}));
  if (Array.isArray(s.people) && s.people[0] === "Ich" && s.people[1] === "Begleitung") s.people = ["Raphael", "Jasmin"];
  return s;
}
let S = normalize(JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("plan") || "null") || {});
const saveLocal = () => localStorage.setItem(KEY, JSON.stringify(S));
const save = () => { saveLocal(); window.TripSync?.schedulePush?.(S); };
let WX = JSON.parse(localStorage.getItem("wx") || "{}");
let cur = 0, edit = false, openIdx = null, lastLoc = "", timeOffset = 0;

const simParam = new URLSearchParams(location.search).get("now");
if (simParam) timeOffset = new Date(simParam + "+02:00") - Date.now();
const now = () => new Date(Date.now() + timeOffset);
function tNow() {
  const s = now().toLocaleString("sv-SE", {timeZone: "Europe/Tallinn"});
  return {date: s.slice(0, 10), mins: +s.slice(11, 13) * 60 + +s.slice(14, 16)};
}
function locate() {
  const {date, mins} = tNow();
  let di = S.days.findIndex(d => d.date === date), t = mins;
  const pi = S.days.findIndex(d => d.date === shiftDate(date, -1));
  if (pi >= 0 && mins < 300 && S.days[pi].items.some(it => toMin(it[0]) >= 1440)) { di = pi; t += 1440; }
  if (di < 0) return null;
  let c = -1, n = -1;
  S.days[di].items.forEach((it, k) => { const v = toMin(it[0]); if (v == null) return; if (v <= t) c = k; else if (n < 0) n = k; });
  return {di, cur: c, next: n, inMin: n >= 0 ? toMin(S.days[di].items[n][0]) - t : null};
}

/* ---------- Plan ---------- */
function wxText(d) {
  const w = WX[d.date];
  if (!w) return `🌡️ typ. −1° / −6°`;
  const i = w.c === 0 ? "☀️" : w.c <= 3 ? "⛅" : w.c <= 48 ? "🌫️" : w.c <= 67 ? "🌧️" : w.c <= 77 ? "❄️" : w.c <= 82 ? "🌦️" : w.c <= 86 ? "🌨️" : "⛈️";
  return `${i} ${w.max}° / ${w.min}°`;
}

function renderTabs() {
  const today = tNow().date, tabs = $("tabs");
  tabs.innerHTML = S.days.map((x, i) => `<button class="${i === cur ? "active" : ""} ${x.date === today ? "today" : ""}" data-i="${i}"><small>${wd(x.date)}</small>${dm(x.date)}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => showDay(+b.dataset.i, +b.dataset.i > cur ? "l" : "r"));
  const a = tabs.children[cur];
  tabs.scrollTo({left: a.offsetLeft - tabs.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth"});
}

function renderNowbar(loc) {
  const nb = $("nowbar");
  if (!loc || (loc.cur < 0 && loc.next < 0)) { nb.hidden = true; return; }
  const items = S.days[loc.di].items, c = items[loc.cur], n = items[loc.next];
  nb.hidden = false;
  nb.innerHTML = (c ? `<b>● Jetzt:</b> ${esc(c[1])}` : `<b>● Heute</b>`) + (n ? `<br><span class="mut">Als Nächstes ${esc(n[0])} · ${esc(n[1])} · in ${fmtMin(loc.inMin)}</span>` : "");
  nb.onclick = () => {
    if (cur !== loc.di) showDay(loc.di);
    setTimeout(() => document.querySelector(".item.now, .item.next")?.scrollIntoView({behavior: "smooth", block: "center"}), 80);
  };
}

function updateProgress() {
  const it = S.days[cur].items, done = it.filter(x => x[4]).length;
  const bar = document.querySelector("#daycard .progress i");
  if (!bar) return;
  bar.style.width = (it.length ? done / it.length * 100 : 0) + "%";
  $("ptext").textContent = `${done} von ${it.length} erledigt`;
}

function renderPlan() {
  const d = S.days[cur], loc = locate(), L = loc && loc.di === cur ? loc : null;
  lastLoc = JSON.stringify(loc);
  document.body.classList.toggle("editing", edit);
  renderTabs();
  renderNowbar(loc);

  const sun = SUN[d.date];
  const light = sun ? toMin(sun[1]) - toMin(sun[0]) : 0;
  const stops = [...new Set(d.items.filter(x => x[2]).map(x => x[2]))];
  const long = new Date(d.date + "T12:00:00").toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long"});
  $("daycard").innerHTML = `
    <h2 id="dtitle" ${edit ? 'contenteditable="true"' : ""}>${esc(d.title)}</h2>
    <div class="meta"><span>📅 ${long}</span><span>${wxText(d)}</span>
      ${sun ? `<span>🌅 ${sun[0]} · 🌇 ${sun[1]}</span><span>☀️ ${Math.floor(light / 60)} h ${light % 60} min Licht</span>` : ""}</div>
    <div class="progress"><i></i></div><div class="meta" id="ptext"></div>
    <div class="actions">${edit
      ? `<button class="pill" id="bSort">⇅ Nach Zeit sortieren</button><button class="pill primary" id="bEdit">✅ Fertig</button>`
      : `<a class="pill" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/${stops.map(encodeURIComponent).join("/")}/data=!4m2!4m1!3e2">🗺️ Tagesroute</a><button class="pill" id="bEdit">✏️ Bearbeiten</button>`}</div>`;
  $("bEdit").onclick = () => { edit = !edit; openIdx = null; renderPlan(); if (!edit) toast("Gespeichert ✓"); };
  if (edit) {
    $("dtitle").oninput = e => { d.title = e.target.textContent; save(); };
    $("bSort").onclick = () => {
      d.items = d.items.map(it => [it, toMin(it[0]) ?? 1e9]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
      save(); renderPlan(); toast("Sortiert");
    };
  }

  const ul = $("list");
  ul.innerHTML = "";
  d.items.forEach((it, k) => ul.appendChild(edit ? editRow(d, it, k) : viewRow(it, k, L)));
  if (edit) {
    const add = document.createElement("li");
    add.className = "item add";
    add.textContent = "＋ Eintrag hinzufügen";
    add.onclick = () => { d.items.push(["", "", "", ""]); save(); renderPlan(); ul.children[d.items.length - 1].querySelector("input").focus(); };
    ul.appendChild(add);
  }
  updateProgress();
}

function viewRow(it, k, L) {
  const [time, title, q, note, dn] = it, li = document.createElement("li");
  const isNow = L && L.cur === k, isNext = L && L.next === k;
  li.className = "item" + (q ? " loc" : "") + (dn ? " done" : "") + (isNow ? " now" : "") + (isNext ? " next" : "") + (openIdx === k ? " open" : "");
  li.innerHTML = `<div class="row"><input type="checkbox" class="check" aria-label="erledigt" ${dn ? "checked" : ""}>
    <div class="body"><span class="time">${esc(time)}${isNow ? '<span class="badge">JETZT</span>' : ""}${isNext ? `<span class="badge nx">in ${fmtMin(L.inMin)}</span>` : ""}</span>
    <span class="title">${esc(title)}</span>${note ? `<span class="note">${linkify(esc(note))}</span>` : ""}</div>
    ${q ? '<span class="chev">›</span>' : ""}</div>${q ? '<div class="detail"></div>' : ""}`;
  const cb = li.querySelector(".check");
  cb.onclick = e => e.stopPropagation();
  cb.onchange = () => { it[4] = cb.checked; li.classList.toggle("done", cb.checked); buzz(); save(); updateProgress(); };
  if (q) {
    li.querySelector(".row").onclick = () => toggleOpen(li, k, q);
    if (openIdx === k) fillDetail(li, q);
  }
  return li;
}

function fillDetail(li, q) {
  li.querySelector(".detail").innerHTML = (mobile.matches ? `<iframe loading="lazy" src="${embed(q)}" title="Karte"></iframe>` : "") +
    `<div class="actions"><a class="pill primary" target="_blank" rel="noopener" href="${navUrl(q)}">🧭 Navigation</a><a class="pill" target="_blank" rel="noopener" href="${mapsUrl(q)}">🗺️ Google Maps</a></div>`;
  if (!mobile.matches) $("map").src = embed(q);
}

function toggleOpen(li, k, q) {
  const was = openIdx === k;
  document.querySelectorAll(".item.open").forEach(x => { x.classList.remove("open"); x.querySelector(".detail").innerHTML = ""; });
  openIdx = was ? null : k;
  if (was) return;
  li.classList.add("open");
  fillDetail(li, q);
  if (mobile.matches) setTimeout(() => li.scrollIntoView({behavior: "smooth", block: "nearest"}), 60);
}

function editRow(d, it, k) {
  const li = document.createElement("li");
  li.className = "item edit";
  li.innerHTML = `<input class="field" value="${esc(it[0])}" placeholder="Zeit"><input class="field" value="${esc(it[1])}" placeholder="Titel">
    <input class="field full" value="${esc(it[2])}" placeholder="📍 Ort (Google-Maps-Suche)">
    <input class="field full" value="${esc(it[3])}" placeholder="📝 Notiz / Link">
    <div class="e-btns"><button data-a="up" aria-label="Nach oben">↑</button><button data-a="down" aria-label="Nach unten">↓</button><button data-a="del" aria-label="Löschen">🗑️</button></div>`;
  li.querySelectorAll("input").forEach((inp, f) => inp.oninput = () => { it[f] = inp.value; save(); });
  li.querySelectorAll("input")[2].onchange = e => e.target.value && !mobile.matches && ($("map").src = embed(e.target.value));
  li.querySelectorAll("button").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "del") {
      if (!confirm(`„${it[1] || "Eintrag"}“ löschen?`)) return;
      d.items.splice(k, 1);
    } else {
      const j = k + (a === "up" ? -1 : 1);
      if (j < 0 || j >= d.items.length) return;
      [d.items[k], d.items[j]] = [d.items[j], d.items[k]];
    }
    buzz(); save(); renderPlan();
  });
  return li;
}

function showDay(i, dir) {
  cur = i; openIdx = null;
  history.replaceState(null, "", location.search + "#" + S.days[i].id);
  renderPlan();
  if (!mobile.matches) $("map").src = embed(S.days[i].city);
  const col = $("daycol");
  col.classList.remove("slide-l", "slide-r");
  if (dir) { void col.offsetWidth; col.classList.add("slide-" + dir); }
  const top = $("tabs").offsetTop;
  if (scrollY > top) scrollTo({top, behavior: "smooth"});
}

/* Swipe zwischen Tagen */
let sx = 0, sy = 0;
$("daycol").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
$("daycol").addEventListener("touchend", e => {
  if (edit) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
  const n = cur + (dx < 0 ? 1 : -1);
  if (n >= 0 && n < S.days.length) { buzz(); showDay(n, dx < 0 ? "l" : "r"); }
});

/* ---------- Kasse ---------- */
let selCat = CATS[0][0];
let moneyDraft = {a: "", t: ""};
function captureMoneyDraft() {
  const a = $("mA"), t = $("mT");
  if (a) moneyDraft.a = a.value;
  if (t) moneyDraft.t = t.value;
}
function renderMoney() {
  captureMoneyDraft();
  const P = S.people, E = S.expenses;
  const total = E.reduce((a, e) => a + e.a, 0), share = total / P.length;
  const paid = P.map((_, i) => E.filter(e => e.p === i).reduce((a, e) => a + e.a, 0));
  const bal = paid.map(v => v - share);
  const deb = bal.map((b, i) => [i, b]).filter(x => x[1] < -0.005), cre = bal.map((b, i) => [i, b]).filter(x => x[1] > 0.005);
  const tx = [];
  for (let i = 0, j = 0; i < deb.length && j < cre.length;) {
    const m = Math.min(-deb[i][1], cre[j][1]);
    tx.push([deb[i][0], cre[j][0], m]);
    deb[i][1] += m; cre[j][1] -= m;
    if (deb[i][1] > -0.005) i++;
    if (cre[j][1] < 0.005) j++;
  }
  const byCat = CATS.map(c => [c, E.filter(e => e.c === c[0]).reduce((a, e) => a + e.a, 0)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  const maxCat = byCat[0]?.[1] || 1;

  $("v-money").innerHTML = `<div class="page">
    <div class="card hero"><span class="mut">Gesamtausgaben</span><div class="big">${eur(total)}</div>
      <span class="mut">${eur(share || 0)} pro Person · ${E.length} Ausgaben</span>
      ${byCat.map(([c, v]) => `<div class="cbar"><span style="width:24px">${c[0]}</span><i style="width:${v / maxCat * 60}%"></i><span>${eur(v)}</span></div>`).join("")}
    </div>
    <div class="card"><h3>➕ Neue Ausgabe</h3>
      <p class="mut" style="margin:0 0 10px">Wer dieses Handy nutzt:</p>
      <div class="actions" style="margin-bottom:10px">${P.map((n, i) => `<button type="button" class="pill ${localStorage.getItem(ME_KEY) === String(i) ? "primary" : ""}" data-me="${i}">${esc(n)}</button>`).join("")}</div>
      <form class="form" id="moneyForm">
      <input id="mA" class="field" type="text" inputmode="decimal" autocomplete="off" placeholder="Betrag in €" value="${esc(moneyDraft.a)}">
      <select id="mP" class="field">${P.map((n, i) => `<option value="${i}">${esc(n)} zahlt</option>`).join("")}</select>
      <input id="mT" class="field full" type="text" autocomplete="off" placeholder="Wofür? z. B. Rataskaevu 16" enterkeyhint="done" value="${esc(moneyDraft.t)}">
      <div class="cats full">${CATS.map(c => `<button type="button" class="cat ${c[0] === selCat ? "sel" : ""}" data-c="${c[0]}">${c[0]}<small>${c[1]}</small></button>`).join("")}</div>
      <button type="submit" id="mAdd" class="pill primary full">Hinzufügen</button></form></div>
    <div class="card"><h3>⚖️ Ausgleich</h3><ul class="plain">
      ${P.map((n, i) => `<li><span class="grow">${esc(n)} <span class="mut">hat ${eur(paid[i])} bezahlt</span></span><span class="amt ${bal[i] >= 0 ? "pos" : "neg"}">${bal[i] >= 0 ? "+" : ""}${eur(bal[i] || 0)}</span></li>`).join("")}
      ${tx.length ? tx.map(([a, b, m]) => `<li><span class="grow">💸 <b>${esc(P[a])}</b> → <b>${esc(P[b])}</b></span><span class="amt">${eur(m)}</span></li>`).join("") : `<li class="mut">✨ Alles ausgeglichen</li>`}
    </ul></div>
    <div class="card"><h3>🧾 Ausgaben</h3><ul class="plain">
      ${E.length ? E.map((e, i) => [e, i]).reverse().map(([e, i]) => `<li><span style="font-size:1.3rem">${e.c}</span><span class="grow">${esc(e.t || "Ausgabe")}<br><span class="mut">${esc(P[e.p] ?? "?")} · ${dm(e.d)}</span></span><span class="amt">${eur(e.a)}</span><button class="x" data-del="${i}" aria-label="Löschen">✕</button></li>`).join("") : `<li class="mut">Noch keine Ausgaben</li>`}
    </ul></div>
    <div class="card"><h3>👥 Reisende</h3><input id="mPeople" class="field" value="${esc(P.join(", "))}">
      <p class="mut">Raphael &amp; Jasmin · Kosten werden zu gleichen Teilen geteilt · gleichen Stand per <b>💾 / 📂</b> oben in der Leiste</p></div>
  </div>`;

  document.querySelectorAll("#v-money .cat").forEach(b => b.onclick = () => { selCat = b.dataset.c; document.querySelectorAll("#v-money .cat").forEach(x => x.classList.toggle("sel", x === b)); buzz(); });
  const me = localStorage.getItem(ME_KEY);
  if (me !== null && +me < P.length) $("mP").value = me;
  document.querySelectorAll("#v-money [data-me]").forEach(b => b.onclick = () => {
    localStorage.setItem(ME_KEY, b.dataset.me);
    $("mP").value = b.dataset.me;
    document.querySelectorAll("#v-money [data-me]").forEach(x => x.classList.toggle("primary", x === b));
    buzz();
    toast(`${P[+b.dataset.me]} auf diesem Gerät`);
  });
  const add = () => {
    const a = parseFloat($("mA").value.replace(",", "."));
    if (!(a > 0)) { toast("Bitte Betrag eingeben"); $("mA").focus(); return; }
    S.expenses.push({a: Math.round(a * 100) / 100, t: $("mT").value.trim(), p: +$("mP").value, c: selCat, d: tNow().date});
    moneyDraft = {a: "", t: ""};
    save(); buzz(); renderMoney(); toast(`${eur(a)} gespeichert`);
  };
  $("moneyForm").onsubmit = e => { e.preventDefault(); add(); };
  $("mA").oninput = e => { moneyDraft.a = e.target.value; };
  $("mT").oninput = e => { moneyDraft.t = e.target.value; };
  document.querySelectorAll("#v-money [data-del]").forEach(b => b.onclick = () => {
    if (!confirm("Ausgabe löschen?")) return;
    S.expenses.splice(+b.dataset.del, 1); save(); renderMoney();
  });
  $("mPeople").onchange = e => {
    const names = e.target.value.split(",").map(s => s.trim()).filter(Boolean);
    if (names.length && names.join(", ") !== S.people.join(", ")) { S.people = names; save(); renderMoney(); }
  };
}

/* ---------- Packliste ---------- */
let packDraft = "";
function capturePackDraft() {
  const p = $("pNew");
  if (p) packDraft = p.value;
}
function updatePackHero() {
  const L = S.packing, done = L.filter(x => x[1]).length;
  const hero = document.querySelector("#v-pack .hero");
  if (!hero) return;
  hero.querySelector(".big").textContent = `${done} / ${L.length}`;
  hero.querySelector(".progress i").style.width = (L.length ? done / L.length * 100 : 0) + "%";
  const hint = hero.querySelector(".mut:last-child");
  if (hint) hint.textContent = done === L.length && L.length ? "🎉 Alles gepackt – ab in den Norden!" : "Im Dezember ist es dort kalt: ca. −1° bis −6°";
}
function renderPack() {
  capturePackDraft();
  const L = S.packing, done = L.filter(x => x[1]).length;
  $("v-pack").innerHTML = `<div class="page">
    <div class="card hero"><span class="mut">Packliste</span><div class="big">${done} / ${L.length}</div>
      <div class="progress"><i style="width:${L.length ? done / L.length * 100 : 0}%"></i></div>
      <span class="mut">${done === L.length && L.length ? "🎉 Alles gepackt – ab in den Norden!" : "Im Dezember ist es dort kalt: ca. −1° bis −6°"}</span></div>
    <div class="card"><form class="addrow" id="packForm"><input id="pNew" class="field" type="text" autocomplete="off" placeholder="Neuer Gegenstand" enterkeyhint="done" value="${esc(packDraft)}"><button type="submit" id="pAdd" class="pill primary" aria-label="Hinzufügen">＋</button></form>
      <ul class="plain">${L.map((x, i) => `<li class="${x[1] ? "done" : ""}"><label><input type="checkbox" class="check" data-i="${i}" ${x[1] ? "checked" : ""}><span>${esc(x[0])}</span></label><button type="button" class="x" data-del="${i}" aria-label="Löschen">✕</button></li>`).join("")}</ul>
    </div></div>`;
  document.querySelectorAll("#v-pack .check").forEach(c => c.onchange = () => {
    L[+c.dataset.i][1] = c.checked;
    c.closest("li").classList.toggle("done", c.checked);
    buzz(); save(); updatePackHero();
  });
  document.querySelectorAll("#v-pack [data-del]").forEach(b => b.onclick = () => { capturePackDraft(); L.splice(+b.dataset.del, 1); save(); renderPack(); });
  const add = () => {
    const v = $("pNew").value.trim();
    if (!v) { toast("Bitte Text eingeben"); $("pNew").focus(); return; }
    L.push([v, false]); packDraft = ""; save(); renderPack(); $("pNew").focus();
  };
  $("packForm").onsubmit = e => { e.preventDefault(); add(); };
  $("pNew").oninput = e => { packDraft = e.target.value; };
}

/* ---------- Infos ---------- */

function doExport() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: "application/json"}));
  a.download = "reiseplan.json";
  a.click();
  toast("Export erstellt");
}
async function doImportFile(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const n = normalize(data);
    if (!n.days.every(d => d.title && Array.isArray(d.items))) throw 0;
    S = n; save(); cur = 0; renderAll(); toast("Import erfolgreich ✓");
  } catch { alert("Ungültige Datei – bitte eine exportierte reiseplan.json wählen."); }
}
function bindSyncControls() {
  $("bExpHdr").onclick = doExport;
  $("bImpHdr").onclick = () => $("file").click();
  $("file").onchange = async e => { await doImportFile(e.target.files[0]); e.target.value = ""; };
}

function syncStatusLabel(st) {
  if (!st) return "Lade Sync …";
  if (!st.configured) return "Firebase noch nicht eingerichtet – siehe FIREBASE_SETUP.md im Repo";
  const m = { off: "⚪ Nicht verbunden", connecting: "🟡 Verbinde …", live: "🟢 Verbunden", offline: "🟠 Offline", locked: "🔒 Passphrase nötig", error: "🔴 Fehler" };
  return (m[st.state] || "⚪") + (st.detail ? " · " + st.detail : "");
}
function bindCloudSync() {
  const idIn = $("sync-trip-id");
  const passIn = $("sync-pass");
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  if (idIn) {
    idIn.oninput = () => { idIn.dataset.touched = "1"; };
    if (!idIn.value) idIn.value = window.TripSync?.getTripId?.() || "";
  }
  on("bSyncCreate", () => {
    const id = window.TripSync.createTripId();
    if (idIn) { idIn.value = id; idIn.dataset.touched = "1"; }
    toast("Neue Trip-ID – an Jasmin schicken");
  });
  on("bSyncCopy", async () => {
    const id = idIn?.value?.trim() || window.TripSync.getTripId();
    if (!id) { toast("Keine Trip-ID"); return; }
    try { await navigator.clipboard.writeText(id); toast("Trip-ID kopiert"); }
    catch { prompt("Trip-ID kopieren:", id); }
  });
  const connect = async () => {
    if (!window.TripSync?.isFirebaseConfigured?.()) {
      alert("Firebase fehlt: firebase-config.js anlegen (siehe firebase-config.example.js und FIREBASE_SETUP.md).");
      return;
    }
    const id = idIn?.value?.trim();
    const pass = passIn?.value || "";
    if (!id) { toast("Trip-ID fehlt"); return; }
    if (!pass || pass.length < 6) { toast("Passphrase (mind. 6 Zeichen)"); passIn?.focus(); return; }
    try {
      await window.TripSync.enableSync(pass, id);
      passIn.value = "";
      toast("Verbunden ✓");
      renderInfo();
    } catch (e) { alert(e.message || e); bindCloudSync(); }
  };
  on("bSyncConnect", () => connect());
  if (passIn) passIn.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); connect(); } };
  on("bSyncOff", () => {
    if (!confirm("Cloud-Sync auf diesem Gerät deaktivieren? (Daten bleiben lokal und in der Cloud.)")) return;
    window.TripSync.disableSync();
    renderInfo();
  });
}

    : "<b>Raphael:</b> Raum erstellen → Trip-ID teilen. <b>Beide:</b> Trip-ID + gleiche Passphrase → Verbinden. Neues Handy lädt den Cloud-Stand, ohne ihn zu überschreiben.";
  $("v-info").innerHTML = `<div class="page">
    <div class="card" id="cloud-card"><h3>☁️ Cloud-Sync</h3>
      <p class="mut" id="sync-status-line">${esc(syncStatusLabel(st))}</p>
      <p class="mut">${syncHelp}</p>
      <label class="mut">Trip-ID</label>
      <div class="addrow"><input id="sync-trip-id" class="field" type="text" autocomplete="off" placeholder="UUID vom ersten Gerät" value="${esc(window.TripSync?.getTripId?.() || "")}"><button type="button" class="pill" id="bSyncCopy" title="Kopieren">📋</button></div>
      ${live ? "" : `<div class="actions"><button type="button" class="pill" id="bSyncCreate">🆕 Raum erstellen (Raphael)</button></div>`}
      <label class="mut">Passphrase</label>

      <div class="actions">
        <button type="button" class="pill primary" id="bSyncConnect">${live ? "Erneut verbinden" : "Verbinden"}</button>
        ${live ? `<button type="button" class="pill" id="bSyncOff">Trennen</button>` : ""}
      </div></div>
    <div class="card"><h3>💾 Backup (Datei)</h3>
      <p class="mut">Fallback ohne Internet oder vor dem ersten Sync. Schnellzugriff: <b>💾 / 📂</b> oben.</p>
      <div class="actions"><button type="button" class="pill" id="bExp">💾 Export</button><button type="button" class="pill" id="bImp">📂 Import</button><button type="button" class="pill" id="bReset">↺ Reset</button></div></div>
    <div class="card"><h3>🎫 Buchungen & Adressen</h3>
      ${S.bookings.map((b, i) => `<div class="bk"><input class="field" data-k="${i}" value="${esc(b.k)}"><button class="x" data-del="${i}" aria-label="Löschen">✕</button><textarea class="field" data-v="${i}" rows="2">${esc(b.v)}</textarea></div>`).join("")}
      <button class="pill" id="bkAdd" style="width:100%">＋ Eintrag</button></div>
    <div class="card"><h3>💡 Gut zu wissen</h3><ul class="facts">${FACTS.map(f => `<li>${f}</li>`).join("")}</ul></div>
    <div class="card"><h3>🗣️ Mini-Sprachführer</h3><table class="phr"><tr><th>🇩🇪</th><th>🇪🇪 Estnisch</th><th>🇫🇮 Finnisch</th></tr>
      ${PHRASES.map(p => `<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td></tr>`).join("")}</table></div>
  </div>`;

  document.querySelectorAll("[data-k]").forEach(x => x.oninput = () => { S.bookings[+x.dataset.k].k = x.value; save(); });
  document.querySelectorAll("[data-v]").forEach(x => {
    const fit = () => { x.style.height = "auto"; x.style.height = x.scrollHeight + 2 + "px"; };
    x.oninput = () => { S.bookings[+x.dataset.v].v = x.value; save(); fit(); };
    requestAnimationFrame(fit);
  });
  document.querySelectorAll("#v-info [data-del]").forEach(b => b.onclick = () => { if (confirm("Eintrag löschen?")) { S.bookings.splice(+b.dataset.del, 1); save(); renderInfo(); } });
  $("bkAdd").onclick = () => { S.bookings.push({k: "📌 Neu", v: ""}); save(); renderInfo(); };
  $("bExp").onclick = doExport;
  $("bImp").onclick = () => $("file").click();
  $("bReset").onclick = () => {
    if (!confirm("Alles (Plan, Kasse, Packliste, Buchungen) auf den Ausgangszustand zurücksetzen?")) return;
    localStorage.removeItem(KEY); localStorage.removeItem("plan");
    S = normalize({}); cur = 0; renderAll(); save(); toast("Zurückgesetzt");
  };
  bindCloudSync();
}

function switchView(v, force) {
  const active = document.querySelector("#bottom .active");
  if (!force && active?.dataset.v === v) return;
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("active", x.id === "v-" + v));
  document.querySelectorAll("#bottom button").forEach(b => b.classList.toggle("active", b.dataset.v === v));
  ({plan: renderPlan, money: renderMoney, pack: renderPack, info: renderInfo})[v]();
  scrollTo({top: 0});
}

/* ---------- Countdown ---------- */
let fired = false;
function tick() {
  const n = now(), cd = $("countdown");
  let target = null, label = "";
  if (n < LAND) { target = LAND; label = "bis zur Landung in Tallinn ✈️"; }
  else if (n < NY) { target = NY; label = "bis 2027 🎆"; }
  if (target) {
    const s = Math.floor((target - n) / 1000);
    const parts = [[Math.floor(s / 86400), "Tage"], [Math.floor(s / 3600) % 24, "Std"], [Math.floor(s / 60) % 60, "Min"], [s % 60, "Sek"]];
    cd.innerHTML = `<div class="cd">${parts.map(([v, l]) => `<div><b>${String(v).padStart(2, "0")}</b><span>${l}</span></div>`).join("")}</div><div class="cdlabel">${label}</div>`;
    cd.classList.toggle("final", target === NY && s <= 10);
  } else {
    cd.classList.remove("final");
    const di = S.days.findIndex(d => d.date === tNow().date);
    cd.innerHTML = `<div class="cdtext">${n < BACK ? `🥂 Head uut aastat! ${di >= 0 ? `· Tag ${di + 1} von ${S.days.length}` : ""}` : "Schön war's 💛"}</div>`;
  }
  if (!fired && n >= NY && n - NY < 120000) { fired = true; fireworks(30); }
  const loc = JSON.stringify(locate());
  if (loc !== lastLoc && !edit && $("v-plan").classList.contains("active")) renderPlan();
}
$("countdown").onclick = () => fireworks(6);

/* ---------- Feuerwerk ---------- */
let fwEnd = 0, fwRun = false, parts = [];
function fireworks(sec) {
  const c = $("fw"), x = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; c.style.display = "block";
  fwEnd = Date.now() + sec * 1000;
  buzz();
  if (fwRun) return;
  fwRun = true;
  let last = 0;
  const burst = () => {
    const cx = c.width * (0.15 + Math.random() * 0.7), cy = c.height * (0.12 + Math.random() * 0.4), hue = Math.random() * 360;
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2, s = (Math.random() * 4 + 1.5) * dpr;
      parts.push({x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 1, h: hue + Math.random() * 40});
    }
  };
  const frame = t => {
    if (Date.now() < fwEnd && t - last > 380) { burst(); last = t; }
    x.globalCompositeOperation = "destination-out";
    x.fillStyle = "rgba(0,0,0,.2)";
    x.fillRect(0, 0, c.width, c.height);
    x.globalCompositeOperation = "lighter";
    parts = parts.filter(p => p.l > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05 * dpr; p.vx *= 0.975; p.vy *= 0.975; p.l -= 0.011;
      x.fillStyle = `hsla(${p.h},100%,65%,${p.l})`;
      x.beginPath(); x.arc(p.x, p.y, 2 * dpr, 0, 7); x.fill();
    }
    if (Date.now() < fwEnd || parts.length) requestAnimationFrame(frame);
    else { c.style.display = "none"; fwRun = false; }
  };
  requestAnimationFrame(frame);
}
$("bFw").onclick = () => fireworks(6);

/* ---------- Wetter (Open-Meteo, max. 16 Tage Vorschau) ---------- */
async function loadWeather() {
  const today = tNow().date, limit = shiftDate(today, 15);
  for (const c of ["ee", "fi"]) {
    const ds = S.days.filter(d => d.c === c && d.date <= limit && d.date >= shiftDate(today, -30)).map(d => d.date).sort();
    if (!ds.length) continue;
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CITY[c][0]}&longitude=${CITY[c][1]}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FTallinn&start_date=${ds[0]}&end_date=${ds.at(-1)}`);
      const j = await r.json();
      j.daily.time.forEach((t, k) => WX[t] = {c: j.daily.weather_code[k], max: Math.round(j.daily.temperature_2m_max[k]), min: Math.round(j.daily.temperature_2m_min[k])});
    } catch {}
  }
  localStorage.setItem("wx", JSON.stringify(WX));
  if ($("v-plan").classList.contains("active") && !edit) renderPlan();
}
